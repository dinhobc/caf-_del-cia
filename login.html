<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Café Delícia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="imagens/logo.png" alt="Logo do Café Delícia" class="logo">
        <h1>Login - Café Delícia</h1>
    </header>

    <section>
        <h2>Faça seu Login</h2>
        <form id="login-form">
            <input type="text" id="login-username" placeholder="Nome de usuário" required>
            <input type="password" id="login-password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Café Delícia - Todos os direitos reservados.</p>
        <p>Desenvolvido por Ricardo De Brito Castro</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
